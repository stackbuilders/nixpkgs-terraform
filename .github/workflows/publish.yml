name: Publish

on:
  release:
    types: [released]

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  flakehub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Publish flake
        uses: DeterminateSystems/flakehub-push@v6
        with:
          tag: ${{ github.ref_name }}
          visibility: public

  flakestry:
    runs-on: ubuntu-latest
    steps:
      - name: Publish flake
        uses: flakestry/flakestry-publish@main
        with:
          version: ${{ github.ref_name }}
