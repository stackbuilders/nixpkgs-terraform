name: Publish

on: push
  # release:
  #   types: [released]

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  flakehub:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Publish flake
        uses: DeterminateSystems/flakehub-push@v6
        with:
          tag: ${{ github.ref_name }}
          visibility: public

  # INFO: The following fork updates the Nix version used by the action to fix
  # the "lastModified" issue. https://flakehub.com/docs/faq#err-last-modified
  flakestry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - v5.21.0
          - v5.20.0
          - v5.19.0
          - v5.18.0
          - v5.17.0
          - v5.16.0
          - v5.15.0
          - v5.14.0
      fail-fast: true
    steps:
      - name: Publish flake
        uses: flakestry/flakestry-publish@main
        with:
          version: ${{ matrix.version }}
          ref: ${{ matrix.version }}
          # version: ${{ github.ref_name }}
